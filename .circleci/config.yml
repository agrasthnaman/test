version: 2.1

orbs:
  jfrog: jfrog/artifactory-orb@1.0.0

jobs:
  upload-artifacts:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - jfrog/install
      - jfrog/configure:
          url: $JFROG_URL
          user: $JFROG_USER
          password: $JFROG_PASSWORD
      
      # Build your application
      - run:
          name: Build with Maven
          command: mvn clean package
      
      # Upload JAR files
      - jfrog/upload:
          source: target/*.jar
          target: libs-release-local/com/mycompany/myapp/

workflows:
  build-and-deploy:
    jobs:
      - upload-artifacts:
          context: jfrog-context
