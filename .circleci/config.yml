version: 2.1

orbs:
  artifactory: jfrog/artifactory-orb@1.0.0

workflows:
  build-and-deploy:
    jobs:
      # Use the orb's built-in upload job
      - artifactory/upload:
          name: "Build and Upload Maven Artifacts"
          source: "target/*.jar"
          target: "libs-release-local/com/mycompany/myapp/"
          build-steps:
            - run:
                name: Build with Maven
                command: mvn clean package
          context: jfrog-context
